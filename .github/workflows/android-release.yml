name: Android APK release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); no setup-android step.

      - name: Dated version
        run: |
          echo "VER=$(TZ=Europe/Budapest date +%Y.%m.%d.%H%M)" >> $GITHUB_ENV
          echo "CODE=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV

      - name: Prepare shell and Capacitor
        run: |
          mkdir -p mobile-shell
          echo '<!doctype html><html><body style="background:#130a24"></body></html>' > mobile-shell/index.html
          node -e '
            const f="capacitor.config.json",c=require("./"+f);
            c.server.url += "/?apk="+process.env.VER+"&repo="+process.env.GITHUB_REPOSITORY;
            require("fs").writeFileSync(f,JSON.stringify(c,null,2));'
          mkdir -p /tmp/cap && cd /tmp/cap && npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cp -r node_modules "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          npx cap add android
          mkdir -p assets
          cp public/icon-512.png assets/icon-only.png
          cp public/icon-maskable-512.png assets/icon-foreground.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#130a24' --iconBackgroundColorDark '#130a24' \
            --splashBackgroundColor '#130a24' --splashBackgroundColorDark '#130a24'
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Hiányzik az ANDROID_KEYSTORE_BASE64 titok"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out technikai-eszkoz-$VER.apk aligned.apk
          $BT/apksigner verify technikai-eszkoz-$VER.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Technikai eszköz ${{ env.VER }}
          files: technikai-eszkoz-${{ env.VER }}.apk
          make_latest: true
