name: Android APK release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); no setup-android step.

      - name: Dated version
        run: |
          echo "VER=$(TZ=Europe/Budapest date +%Y.%m.%d.%H%M)" >> $GITHUB_ENV
          echo "CODE=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV

      - name: Prepare shell and Capacitor
        run: |
          # Teljes felület az APK-ba építve: internet nélkül is megnyílik
          npm i -g bun
          bun install --frozen-lockfile || bun install
          APK_SPA=1 bunx vite build
          rm -rf mobile-shell && cp -r dist/client mobile-shell
          node -e '
            const fs=require("fs"),f="mobile-shell/_shell.html";
            const tag="<script>window.__APK__="+JSON.stringify({v:process.env.VER,repo:process.env.GITHUB_REPOSITORY})+"</script>";
            fs.writeFileSync("mobile-shell/index.html",fs.readFileSync(f,"utf8").replace("<head>","<head>"+tag));'
          test -s mobile-shell/index.html
          rm -rf node_modules
          mkdir -p /tmp/cap && cd /tmp/cap && npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cp -r node_modules "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          npx cap add android
          mkdir -p assets
          cp public/icon-512.png assets/icon-only.png
          cp public/icon-maskable-512.png assets/icon-foreground.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#130a24' --iconBackgroundColorDark '#130a24' \
            --splashBackgroundColor '#130a24' --splashBackgroundColorDark '#130a24'
          npx cap sync android

      - name: Fix adaptive icon background
        run: |
          # A capacitor-assets az adaptív ikon XML-ekben a @mipmap/ic_launcher_background
          # képre hivatkozik, de egyszínű háttérnél nem készít ilyen fájlt (AAPT hiba).
          # Ezért egyszínű színerőforrást adunk, és a hivatkozásokat arra irányítjuk.
          RES=android/app/src/main/res
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#130a24</color>
          </resources>
          XML
          # a heredoc behúzását eltávolítjuk, hogy az XML-deklaráció az első sorban legyen
          sed -i 's/^ *//' "$RES/values/ic_launcher_background.xml"

          if ls $RES/mipmap-*/ic_launcher_foreground.png >/dev/null 2>&1; then
            FG="@mipmap/ic_launcher_foreground"
          else
            FG="@drawable/ic_launcher_foreground"
          fi
          echo "Előtér: $FG"

          for n in ic_launcher ic_launcher_round; do
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/ic_launcher_background"/>' \
              "    <foreground android:drawable=\"$FG\"/>" \
              '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/$n.xml"
          done

          # Ellenőrzés: nem maradhat hivatkozás hiányzó mipmap háttérre
          if grep -rn "mipmap/ic_launcher_background" "$RES"; then
            echo "Hiba: maradt hivatkozás a hiányzó mipmap/ic_launcher_background-ra"; exit 1
          fi
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Apply edge-to-edge native shell
        run: |
          # Teljes képernyős héj: átlátszó állapot- és navigációs sáv (native/MainActivity.java)
          DIR=android/app/src/main/java/hu/technikaieszkoz/nyilvantartas
          test -d "$DIR" || { echo "Hiba: nincs $DIR"; find android/app/src/main/java -type f; exit 1; }
          cp native/MainActivity.java "$DIR/MainActivity.java"
          grep -n "class MainActivity" "$DIR/MainActivity.java"

      - name: Set version
        working-directory: android
        run: |
          # versionCode: perc alapú, mindig nő -> az Android a régi APK fölé telepíti az újat
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $CODE/; s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$VER\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          grep -q "versionCode $CODE" app/build.gradle || { echo "Hiba: a versionCode nem íródott át"; exit 1; }
          grep -q "versionName \"$VER\"" app/build.gradle || { echo "Hiba: a versionName nem íródott át"; exit 1; }

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-v1

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i -E 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep -n networkTimeout gradle/wrapper/gradle-wrapper.properties || echo "networkTimeout=120000" >> gradle/wrapper/gradle-wrapper.properties
          # A Gradle-letöltés (services.gradle.org -> github.com) néha 5xx hibát ad: 6 próba, növekvő várakozással
          ok=0
          for i in 1 2 3 4 5 6; do
            if ./gradlew --version; then ok=1; break; fi
            echo "Gradle letöltés sikertelen ($i/6), újrapróbálás $((i*20)) mp múlva..."
            rm -rf ~/.gradle/wrapper/dists/gradle-*
            sleep $((i*20))
          done
          [ "$ok" = 1 ] || { echo "A Gradle letöltése 6 próba után sem sikerült"; exit 1; }
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Hiányzik az ANDROID_KEYSTORE_BASE64 titok"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out technikai-eszkoz-$VER.apk aligned.apk
          $BT/apksigner verify technikai-eszkoz-$VER.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Technikai eszköz ${{ env.VER }}
          files: technikai-eszkoz-${{ env.VER }}.apk
          make_latest: true
